[project]
name = "latent-world-model"
version = "0.1.0"
description = "V-JEPA-style latent world model for robotics: frozen video encoder + action-conditioned predictor + planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lve", "src/lwp", "src/planning"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
