[project]
name = "latent-video-encoder"
version = "0.1.0"
description = "V-JEPA-style self-supervised video encoder pretraining (encoder only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lve"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
