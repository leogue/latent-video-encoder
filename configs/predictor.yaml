# Stage 2: action-conditioned world predictor.
# Synthetic controllable env (action = velocity) — validates the pipeline on CPU.
# For real data: set data.backend=lerobot + data.repo_id, and encoder.path to a
# Stage-1 export (encoder.pt). state_dim/action_dim must match the dataset.
seed: 42
device: cpu
precision: fp32

encoder:
  path: ""            # "" = fresh frozen encoder from the dims below (debug/synthetic)
  image_size: 64
  num_frames: 16
  tubelet_size: [2, 16, 16]
  embed_dim: 192
  depth: 4
  num_heads: 6
  pos_embed_type: rope_3d

data:
  backend: synthetic  # synthetic | lerobot
  num_frames: 16
  image_size: 64
  state_dim: 2
  action_dim: 2
  batch_size: 8
  samples_per_epoch: 5000
  frame_stride: 1
  repo_id: ""         # lerobot backend: HF id or local dataset
  root: ""
  camera_key: ""

predictor:
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  drop_path_rate: 0.0

world:
  rollout_steps: 4
  rollout_weight: 1.0
  tf_weight: 1.0

optimizer:
  lr: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 500
  max_steps: 20000
  min_lr: 0.000001

training:
  max_steps: 20000
  log_every: 50
  save_every: 2000
  grad_clip_norm: 1.0
  output_dir: ./runs/world
