seed: 42
device: cpu
precision: fp32

data:
  root: ./data/videos
  backend: synthetic
  clip_frames: 16
  frame_stride: 2
  image_size: 128
  batch_size: 2
  num_workers: 0

model:
  in_channels: 3
  image_size: 128
  num_frames: 16
  tubelet_size: [2, 16, 16]
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  pos_embed_type: rope_3d
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  use_cls_token: false

predictor:
  embed_dim: 256
  depth: 4
  num_heads: 4
  mlp_ratio: 4.0
  pos_embed_type: rope_3d

masking:
  blocks:
    - num_blocks: 8          # short-range
      spatial_scale: [0.15, 0.15]
      temporal_scale: [1.0, 1.0]
      aspect_ratio: [0.75, 1.5]
    - num_blocks: 2          # long-range
      spatial_scale: [0.7, 0.7]
      temporal_scale: [1.0, 1.0]
      aspect_ratio: [0.75, 1.5]
  max_keep: null

loss:
  name: l1
  target_norm: layernorm
  reg_coeff: 0.0

optimizer:
  name: adamw
  lr: 0.000625
  start_lr: 0.0002
  final_lr: 0.000001
  weight_decay: 0.04
  final_weight_decay: 0.4
  betas: [0.9, 0.95]

scheduler:
  name: warmup_constant_decay
  warmup_steps: 1000
  cooldown_steps: 1000
  max_steps: 20000
  min_lr: 0.000001

ema:
  schedule: linear
  momentum_start: 0.998
  momentum_end: 1.0

training:
  max_steps: 20000
  log_every: 20
  save_every: 1000
  grad_clip_norm: 1.0
  output_dir: ./runs/tiny
  compile: false
