# ViT-L/16 reference scale (V-JEPA 2). This is the encoder you actually ship for
# the downstream world model. Needs a GPU and a real video dataset.
seed: 42
device: cuda
precision: bf16

data:
  root: ./data/videos
  backend: torchvision
  clip_frames: 16
  frame_stride: 4
  image_size: 224
  batch_size: 24
  num_workers: 8

model:
  in_channels: 3
  image_size: 224
  num_frames: 16
  tubelet_size: [2, 16, 16]
  embed_dim: 1024
  depth: 24
  num_heads: 16
  mlp_ratio: 4.0
  pos_embed_type: rope_3d
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  use_cls_token: false

predictor:
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  pos_embed_type: rope_3d

masking:
  blocks:
    - num_blocks: 8
      spatial_scale: [0.15, 0.15]
      temporal_scale: [1.0, 1.0]
      aspect_ratio: [0.75, 1.5]
    - num_blocks: 2
      spatial_scale: [0.7, 0.7]
      temporal_scale: [1.0, 1.0]
      aspect_ratio: [0.75, 1.5]
  max_keep: null

loss:
  name: l1
  target_norm: layernorm
  reg_coeff: 0.0

optimizer:
  name: adamw
  lr: 0.000625
  start_lr: 0.0002
  final_lr: 0.000001
  weight_decay: 0.04
  final_weight_decay: 0.4
  betas: [0.9, 0.95]

scheduler:
  name: warmup_constant_decay
  warmup_steps: 12000
  cooldown_steps: 12000
  max_steps: 252000
  min_lr: 0.000001

ema:
  schedule: linear
  momentum_start: 0.998
  momentum_end: 1.0

training:
  max_steps: 252000
  log_every: 20
  save_every: 2000
  grad_clip_norm: 1.0
  output_dir: ./runs/vitl16
  compile: true
